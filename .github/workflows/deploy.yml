name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - docs-index-updated

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build --no-cache -t team-hub:ci .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy placeholder
        run: |
          echo "Team Hub deploy workflow verified image build."
          echo "Configure your VPS deploy step here (SSH pull/restart) when ready."
